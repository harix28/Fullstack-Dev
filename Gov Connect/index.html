<!doctype html>
<html lang="en" class="light" style="color-scheme: light;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GovConnect — Unified Citizen Services Platform. Discover government schemes, jobs, manage documents, and get grievance assistance." />
    <meta name="theme-color" content="#F5EBE0" />
    <title>GovConnect — Unified Citizen Services</title>
    <script>
      try {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
        document.documentElement.style.colorScheme = 'light';
        localStorage.setItem('govconnect_theme', 'light');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#F5EBE0] text-[#2D231E]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
